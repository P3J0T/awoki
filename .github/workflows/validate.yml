name: Validate Awoki

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          # Match the runtime's Go builder; there is no module dependency cache.
          go-version: '1.26.5'
          cache: false
      - name: Install constrained Python dependencies
        run: |
          python -m pip install -r requirements.txt -c requirements.lock
          python -m pip check
      - name: Build pinned Go semantics helper before parallel tests
        shell: bash
        run: |
          set -euo pipefail
          # Keep cold compilation outside the bounded semantics request timeout.
          CGO_ENABLED=0 GO111MODULE=off GOTOOLCHAIN=local \
            go build -trimpath -ldflags="-s -w" \
            -o "$RUNNER_TEMP/awoki-go-semantics" .harness/code_search/go_semantics_probe.go
          sudo install -m 755 "$RUNNER_TEMP/awoki-go-semantics" /usr/local/bin/awoki-go-semantics
          test "$(/usr/local/bin/awoki-go-semantics --version)" = 'awoki-go-semantics go1.26.5'
          PYTHONPATH=.harness python - <<'PY'
          from code_search.semantics import check_go_semantics
          result = check_go_semantics("path_join", {"parts": ["/base", "/api"]})
          assert result["status"] == "ok", result
          assert result["execution_backend"] == "prebuilt_pinned_helper", result
          print("go_semantics_ci_backend=prebuilt_pinned_helper")
          PY
      - name: Resolve and type-check the current OpenCode SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_version="$(npm view opencode-ai version)"
          sdk_dir="$(mktemp -d)"
          npm install --prefix "$sdk_dir" --ignore-scripts --save-exact \
            typescript@7.0.2 @types/node@22.20.2 \
            "@opencode-ai/plugin@$sdk_version" "@opencode-ai/sdk@$sdk_version"
          export PATH="$sdk_dir/node_modules/.bin:$PATH"
          tsc --version
          AWOKI_PLUGIN_NODE_MODULES="$sdk_dir/node_modules" \
            python .harness/validate_opencode_plugin.py --require-sdk
      - name: Validate source and run regression suite
        run: make validate PYTHON=python
      - name: Exercise all provider authentication contracts on loopback
        run: make ai-config-test PYTHON=python
