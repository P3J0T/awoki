[project]
name = "awoki"
version = "0.1.7"
description = "Awoki: Docker-first evidence, retrieval, verification, and continuity harness for OpenCode investigations"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.29,<2",
  "qdrant-client>=1.15.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
  "rich>=13.7.0",
  "orjson>=3.10.0",
  "httpx>=0.27.0",
  "rank-bm25>=0.2.2",
  "pytest>=8.2.0",
  "openai>=1.40.0",
  "tree-sitter-language-pack==0.10.0",
  "tree-sitter==0.25.2",
  "tree-sitter-c-sharp==0.23.1",
  "tree-sitter-embedded-template==0.25.0",
  "tree-sitter-yaml==0.7.2"
]

[tool.pytest.ini_options]
testpaths = [".harness/tests"]
